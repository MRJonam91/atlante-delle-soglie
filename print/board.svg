<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 1485 1050" role="img" aria-labelledby="title desc">
  <title id="title">La Fiera dei Domani / The Fair of Tomorrows</title>
  <desc id="desc">Public eight-zone board. Connections: A-B, B-C, B-D, C-E, D-E, E-F1, F1-F2, F1-F3. Original geometric artwork, CC BY-SA 4.0.</desc>
